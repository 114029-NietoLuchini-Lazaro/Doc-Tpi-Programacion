name: llm-service CI

on:
  push:
    branches: [main, dev, facu]
    paths: ["llm-service/**", ".github/workflows/llm-service-ci.yml"]
  pull_request:
    paths: ["llm-service/**", ".github/workflows/llm-service-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `verify` corre tests + ArchUnit + el gate de JaCoCo definido en pom.xml.
      # Si la cobertura baja del umbral, el job falla y el PR no se puede mergear.
      - name: Tests y gate de cobertura
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: llm-service/target/site/jacoco
