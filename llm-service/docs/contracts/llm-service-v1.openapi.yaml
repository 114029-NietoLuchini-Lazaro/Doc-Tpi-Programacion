openapi: 3.1.0
info:
  title: LLM Service API (v1 - Histórico / Reemplazado)
  version: 1.0.0
  x-deprecated: true
  description: |
    DOCUMENTO HISTÓRICO - REEMPLAZADO POR v2.
    El flujo de Golden Set v1 (/golden-sets) fue retirado en commit 605f381 y reemplazado por la arquitectura con ámbito de curso (v2).
    Para el contrato vigente del Golden Set y Calibración, consultar llm-service-v2-golden-set.openapi.yaml.
    API privada de llm-service. Toda llamada ingresa mediante API Gateway.
servers:
  - url: /api/llm
security:
  - serviceJwt: []
paths:
  /tutor/interactions:
    post:
      summary: Genera una respuesta socrática para un intento práctico
      operationId: createTutorInteraction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TutorInteractionRequest' }
      responses:
        '200': { description: Respuesta segura del tutor, content: { application/json: { schema: { $ref: '#/components/schemas/TutorInteractionResponse' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /tutor/conversations:
    post:
      summary: Crea una conversación de tutoría con histórico multi-turno
      operationId: createConversation
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201': { description: Conversación creada, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      summary: Lista conversaciones de tutoría, filtrables por alumno y/o curso
      operationId: listConversations
      parameters:
        - { name: learnerId, in: query, schema: { type: string, format: uuid } }
        - { name: courseCohortId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Conversaciones, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } }
  /tutor/conversations/{conversationId}/messages:
    get:
      summary: Consulta el histórico de mensajes de una conversación
      operationId: getConversationMessages
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      responses:
        '200': { description: Histórico de mensajes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /rag/documents:
    get:
      summary: Lista las fuentes activas de un curso/cohorte (EP-09)
      operationId: listRagDocuments
      parameters:
        - { name: courseCohortId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Fuentes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RagDocument' } } } } }
    post:
      summary: Sube e indexa un PDF como fuente RAG
      operationId: uploadRagDocument
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [courseCohortId, file]
              properties:
                courseCohortId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '201': { description: Fuente indexada, content: { application/json: { schema: { $ref: '#/components/schemas/RagDocument' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /rag/documents/{documentId}:
    delete:
      summary: Retira una fuente (borrado lógico; conserva el historial de auditoría)
      operationId: deleteRagDocument
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      responses:
        '204': { description: Fuente retirada }
        '404': { $ref: '#/components/responses/Problem' }
  /rag/documents/{documentId}/chunks:
    get:
      summary: Lista los fragmentos vectorizados de una fuente
      operationId: listRagDocumentChunks
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      responses:
        '200': { description: Fragmentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocumentChunk' } } } } }
  /rag/documents/{documentId}/images:
    get:
      summary: Detecta imágenes/diagramas de contenido genuino dentro del PDF
      operationId: listRagDocumentImages
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      responses:
        '200': { description: Imágenes detectadas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImageDetection' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /rag/documents/{documentId}/images/{imageIndex}/decode:
    post:
      summary: Decodifica determinísticamente (sin IA) una imagen del PDF
      operationId: decodeRagDocumentImage
      parameters: [ { $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/ImageIndex' } ]
      responses:
        '200': { description: Diagrama decodificado, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramDecodeResult' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /rag/documents/{documentId}/diagrams:
    post:
      summary: Indexa un diagrama ya decodificado como chunk semántico
      operationId: indexRagDocumentDiagram
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramDecodeResult' }
      responses:
        '201': { description: Diagrama indexado }
        '404': { $ref: '#/components/responses/Problem' }
  /rag/chat:
    post:
      summary: Pregunta al tutor sobre las fuentes seleccionadas, con citas de fuente y página
      operationId: createRagChat
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagChatRequest' }
      responses:
        '200': { description: Respuesta del tutor con citas, content: { application/json: { schema: { $ref: '#/components/schemas/RagChatResponse' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluations/{evaluationId}:
    get:
      summary: Consulta el detalle de una evaluación de uso de IA
      operationId: getEvaluation
      parameters: [ { $ref: '#/components/parameters/EvaluationId' } ]
      responses:
        '200': { description: Evaluación, content: { application/json: { schema: { $ref: '#/components/schemas/Evaluation' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /evaluations/{evaluationId}/appeals:
    post:
      summary: Registra la apelación del alumno
      operationId: createAppeal
      parameters: [ { $ref: '#/components/parameters/EvaluationId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AppealRequest' } } }
      responses: { '202': { description: Apelación registrada }, '409': { $ref: '#/components/responses/Problem' } }
  /evaluations/{evaluationId}/overrides:
    post:
      summary: Registra un override docente append-only
      operationId: createEvaluationOverride
      parameters: [ { $ref: '#/components/parameters/EvaluationId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OverrideRequest' } } }
      responses: { '201': { description: Override auditado }, '403': { $ref: '#/components/responses/Problem' } }
  /golden-sets:
    post:
      summary: Crea una versión de golden set
      operationId: createGoldenSet
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rubricVersion, language], properties: { rubricVersion: { type: string }, language: { type: string, const: es } } } } }
      responses: { '201': { description: Golden set creado }, '403': { $ref: '#/components/responses/Problem' } }
  /golden-sets/{goldenSetId}/entries:
    post:
      summary: Incorpora una transcripción con puntaje docente de referencia
      operationId: createGoldenSetEntry
      parameters: [ { $ref: '#/components/parameters/GoldenSetId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [transcript, referenceScores], properties: { transcript: { type: array, items: { type: object } }, referenceScores: { $ref: '#/components/schemas/Dimensions' } } } } }
      responses: { '201': { description: Entrada creada }, '422': { $ref: '#/components/responses/Problem' } }
  /calibrations:
    post:
      summary: Inicia una corrida de calibración
      operationId: createCalibration
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [courseCohortId, goldenSetId], properties: { courseCohortId: { type: string, format: uuid }, goldenSetId: { type: string, format: uuid } } } } }
      responses: { '202': { description: Trabajo aceptado, headers: { Location: { schema: { type: string } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /jobs/{jobId}:
    get:
      summary: Consulta el estado de un trabajo asíncrono
      operationId: getJob
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '200': { description: Estado de trabajo, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '404': { $ref: '#/components/responses/Problem' } }
  /course-cohorts/{courseCohortId}/calibration:
    get:
      summary: Consulta la habilitación de calibración de una cohorte
      operationId: getCourseCalibration
      parameters: [ { $ref: '#/components/parameters/CourseCohortId' } ]
      responses: { '200': { description: Estado de calibración }, '404': { $ref: '#/components/responses/Problem' } }
  /course-cohorts/{courseCohortId}/pending-evaluations:
    get:
      summary: Cuenta las evaluaciones diferidas que bloquean el cierre
      operationId: getPendingEvaluations
      parameters: [ { $ref: '#/components/parameters/CourseCohortId' } ]
      responses: { '200': { description: Pendientes, content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, minimum: 0 }, oldestPendingSince: { type: string, format: date-time } } } } } } }
  /model-assignments/{function}:
    get:
      summary: Consulta el modelo activo para una función
      operationId: getModelAssignment
      parameters: [ { $ref: '#/components/parameters/Function' } ]
      responses: { '200': { description: Asignación activa } }
    put:
      summary: Cambia la asignación modelo-función con auditoría
      operationId: putModelAssignment
      parameters: [ { $ref: '#/components/parameters/Function' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, modelId], properties: { provider: { type: string }, modelId: { type: string }, modelVersion: { type: string } } } } }
      responses: { '200': { description: Asignación actualizada }, '403': { $ref: '#/components/responses/Problem' } }
components:
  securitySchemes:
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string, format: uuid } }
    GoldenSetId: { name: goldenSetId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseCohortId: { name: courseCohortId, in: path, required: true, schema: { type: string, format: uuid } }
    Function: { name: function, in: path, required: true, schema: { type: string, enum: [tutor, evaluator, embedding] } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    ImageIndex: { name: imageIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
  responses:
    Problem: { description: RFC 7807 Problem Details; requestId travels in X-Request-Id and body extension. }
  schemas:
    TutorInteractionRequest:
      type: object
      required: [attemptId, challengeId, courseCohortId, learnerId, message, riskLevel]
      properties:
        attemptId: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        courseCohortId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        message: { type: string, minLength: 1 }
        riskLevel: { type: string, enum: [high, medium, low] }
        conversacionId: { type: string, format: uuid, nullable: true, description: 'Opcional. Si no viene, la interacción es independiente (comportamiento actual, sin cambios).' }
    TutorInteractionResponse:
      type: object
      required: [message, state, conversacionId]
      properties: { message: { type: string }, state: { type: string, enum: [completed, blocked, unavailable] }, conversacionId: { type: string, format: uuid, description: 'Siempre presente: se genera si no vino en el request.' } }
    CreateConversationRequest:
      type: object
      required: [courseCohortId, learnerId]
      properties:
        courseCohortId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        titulo: { type: string }
    Conversation:
      type: object
      required: [id, courseCohortId, learnerId, titulo, estado, createdAt]
      properties:
        id: { type: string, format: uuid }
        courseCohortId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        challengeId: { type: string, format: uuid, nullable: true }
        titulo: { type: string }
        estado: { type: string }
        createdAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversationId, rol, contenido, timestamp]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        rol: { type: string, enum: [alumno, tutor] }
        contenido: { type: string }
        timestamp: { type: string, format: date-time }
    RagDocument:
      type: object
      required: [id, courseCohortId, fileName, fileSizeBytes, pageCount, chunkCount, uploadedAt, active]
      properties:
        id: { type: string, format: uuid }
        courseCohortId: { type: string, format: uuid }
        fileName: { type: string }
        fileSizeBytes: { type: integer }
        pageCount: { type: integer }
        chunkCount: { type: integer }
        uploadedAt: { type: string, format: date-time }
        previewText: { type: string, nullable: true }
        active: { type: boolean }
    DocumentChunk:
      type: object
      required: [id, documentId, documentName, pageNumber, chunkIndex, content]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentName: { type: string }
        pageNumber: { type: integer }
        chunkIndex: { type: integer }
        content: { type: string }
        similarityScore: { type: number }
    RagSourceCitation:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        documentName: { type: string }
        pageNumber: { type: integer }
        chunkIndex: { type: integer }
        score: { type: number }
        textoExtracto: { type: string }
    ImageDetection:
      type: object
      properties:
        imageIndex: { type: integer }
        pageNumber: { type: integer }
        width: { type: integer }
        height: { type: integer }
        format: { type: string }
        base64Data: { type: string }
        titleHint: { type: string, nullable: true }
    DiagramDecodeResult:
      type: object
      properties:
        imageIndex: { type: integer }
        pageNumber: { type: integer }
        tituloDetectado: { type: string }
        tipoDiagrama: { type: string }
        interpretacion: { type: string }
        mermaidCode: { type: string }
        elementosEncontrados: { type: array, items: { type: string } }
    RagChatRequest:
      type: object
      required: [courseCohortId, learnerId, documentIds, pregunta]
      properties:
        courseCohortId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        documentIds: { type: array, items: { type: string, format: uuid }, description: 'Vacío -> estado BLOCKED_NO_SOURCE, sin invocar al modelo (0 tokens).' }
        pregunta: { type: string, minLength: 4, maxLength: 600 }
        conversacionId: { type: string, format: uuid, nullable: true }
    RagChatResponse:
      type: object
      required: [respuesta, estado]
      properties:
        respuesta: { type: string }
        estado: { type: string, enum: [OK, UNAVAILABLE, BLOCKED_NO_SOURCE, BLOCKED_EMPTY, BLOCKED_TOO_SHORT, BLOCKED_TOO_LONG, BLOCKED_SPAM, BLOCKED_RATE_LIMIT, BLOCKED_PROFANITY, BLOCKED_INJECTION] }
        mensajeValidacion: { type: string, nullable: true }
        tokensGastados: { type: integer }
        cached: { type: boolean }
        rolTutor: { type: string }
        fuentes: { type: array, items: { $ref: '#/components/schemas/RagSourceCitation' } }
        conversacionId: { type: string, format: uuid, nullable: true }
    Dimensions:
      type: object
      required: [clarity, autonomy, progression, compliance, efficiency]
      properties:
        clarity: { type: integer, minimum: 0, maximum: 100 }
        autonomy: { type: integer, minimum: 0, maximum: 100 }
        progression: { type: integer, minimum: 0, maximum: 100 }
        compliance: { type: integer, minimum: 0, maximum: 100 }
        efficiency: { type: integer, minimum: 0, maximum: 100 }
    Evaluation:
      type: object
      required: [id, aggregateScore, dimensions, confidence, rubricVersion, modelId, modelVersion]
      properties:
        id: { type: string, format: uuid }
        aggregateScore: { type: integer, minimum: 0, maximum: 100 }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rubricVersion: { type: string }
        modelId: { type: string }
        modelVersion: { type: string }
    AppealRequest: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } }
    OverrideRequest: { type: object, required: [aggregateScore, reason], properties: { aggregateScore: { type: integer, minimum: 0, maximum: 100 }, reason: { type: string, minLength: 1 } } }
    Job: { type: object, required: [id, state], properties: { id: { type: string, format: uuid }, state: { type: string, enum: [queued, running, completed, failed] } } }
