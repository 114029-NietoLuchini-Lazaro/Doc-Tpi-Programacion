services:
  llm-service:
    # Activa WorkbenchCorsConfiguration (permite http://localhost:4200) y
    # WorkbenchDemoCatalog (identidad docente de prueba fija) — ver
    # application-workbench.yml. No se usa en la integración real: ahí el API Gateway
    # valida la sesión y agrega los headers M2M que el servicio exige.
    environment:
      SPRING_PROFILES_ACTIVE: workbench

  workbench:
    build:
      context: ./llm-workbench
      dockerfile: Dockerfile.dev
    ports: ["4200:4200"]
    volumes:
      - ./llm-workbench:/workspace
      - workbench_node_modules:/workspace/node_modules
    depends_on:
      llm-service:
        condition: service_healthy

volumes:
  workbench_node_modules:
