services:
  llm-service:
    environment:
      SPRING_PROFILES_ACTIVE: workbench
      LLM_PROVIDER_FAKE_ENABLED: "true"

  workbench:
    build:
      context: ./llm-workbench
      dockerfile: Dockerfile.dev
    ports: ["4200:4200"]
    volumes:
      - ./llm-workbench:/workspace
      - workbench_node_modules:/workspace/node_modules
    depends_on:
      llm-service:
        condition: service_healthy

volumes:
  workbench_node_modules:
