events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        location /api/llm/ {
            proxy_pass http://llm-service:8080/api/llm/;
            
            # Prevent clients from injecting their own identity
            proxy_set_header X-Service-Id "admin-service";
            proxy_set_header X-Service-Scopes "llm.golden-set.manage llm.rubric-template.manage";
            proxy_set_header X-Delegated-User "11111111-1111-1111-1111-111111111111";

            # Forward original headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/courses/ {
            proxy_pass http://demo-courses:1080/api/courses/;
        }
    }
}
