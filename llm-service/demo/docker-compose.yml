services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 5s
      timeout: 3s
      retries: 12

  llm-service:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: workbench
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/llm
      SPRING_DATASOURCE_USERNAME: llm
      SPRING_DATASOURCE_PASSWORD: llm
      LLM_CREDENTIALS_MASTER_KEY: ${LLM_CREDENTIALS_MASTER_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      LLM_COURSES_BASE_URL: http://demo-gateway:8080
      LLM_COURSES_SERVICE_TOKEN: "demo-token"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12

  demo-gateway:
    image: nginx:1.25-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - llm-service
      - demo-courses

  demo-courses:
    image: mockserver/mockserver:mockserver-5.15.0
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    ports:
      - "1080:1080"
    volumes:
      - ./courses/expectations.json:/config/expectations.json:ro

  llm-workbench:
    build:
      context: ../llm-workbench
      dockerfile: Dockerfile.demo
    ports:
      - "4200:80"
    depends_on:
      - demo-gateway
