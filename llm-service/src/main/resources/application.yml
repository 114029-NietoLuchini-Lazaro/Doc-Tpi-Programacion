server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: llm-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/llm}
    username: ${SPRING_DATASOURCE_USERNAME:llm}
    password: ${SPRING_DATASOURCE_PASSWORD:llm}
  flyway:
    schemas: llm
    default-schema: llm
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
llm:
  gateway:
    trusted-service: admin-service
    required-scope: llm.golden-set.manage
  tutor:
    trusted-service: practice-service
    required-scope: llm.tutor.interact
    invocation-timeout-ms: 8000
  rag:
    trusted-service: practice-service
    required-scope: llm.rag.query
    embedding-timeout-ms: 8000
    max-upload-bytes: 26214400
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: false   # llm-service nunca resuelve otros servicios por Eureka (todo pasa por el Gateway)
    healthcheck:
      enabled: true         # Actuator reporta el estado real al servidor Eureka; evita que el Gateway rutee al servicio cuando la DB está caída
  instance:
    prefer-ip-address: true
