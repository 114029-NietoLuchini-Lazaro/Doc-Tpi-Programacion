# Resolver DNS para llm-service bajo Tailscale mesh.
# Permite resolver la infraestructura de plataforma vía MagicDNS (100.100.100.100)
# y contenedores internos del compose (Postgres) vía el DNS embebido de Docker (127.0.0.11).

nameserver 100.100.100.100
nameserver 127.0.0.11
search tail767776.ts.net
options ndots:1 timeout:2 attempts:2
