# Resolver del micro.
#
# Con network_mode: "service:<sidecar>" el daemon rechaza `dns:`, asi que este
# archivo se monta en /etc/resolv.conf:ro del micro.

# ---------------------------------------------------------------------------
# CASO A — el micro NO resuelve otros contenedores de su compose por nombre
#          (como ping-service, que solo habla con la plataforma).
#          Verificado en la prueba.
# ---------------------------------------------------------------------------
nameserver 100.100.100.100
search <TAILNET>.ts.net
options ndots:1 timeout:2 attempts:2

# ---------------------------------------------------------------------------
# CASO B — el micro SI habla con servicios propios por nombre (mysql, redis...).
#
# ATENCION: ELIMINAR la linea de arriba y usar AMBOS resolvers, y VERIFICAR
# que los dos nombres resuelvan. El orden importa y el comportamiento depende
# del resolver (glibc o musl): un NXDOMAIN del primero puede cortar la cadena
# antes de consultar el segundo.
#
#   nameserver 100.100.100.100   # MagicDNS (plataforma)
#   nameserver 127.0.0.11        # DNS embebido de Docker (servicios propios)
#
# Verificacion obligatoria dentro del micro:
#   nslookup <servicio-propio>            -> debe responder (ej. mysql)
#   nslookup <TS_SERVER_HOST>             -> debe responder
#
# Si alguno deja de resolver: no usar MagicDNS en ese micro y direccionar la
# plataforma por IP (efimera, coordinar) o los servicios propios por IP/alias.
# ---------------------------------------------------------------------------
